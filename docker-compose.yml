# Banco PostgreSQL local para desenvolvimento:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kimono
      POSTGRES_PASSWORD: kimono
      POSTGRES_DB: kimono_store
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
